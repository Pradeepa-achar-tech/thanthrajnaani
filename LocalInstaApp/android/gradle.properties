org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental-compile cache computes relative paths between the
# Gradle/pub cache and the project — on Windows, when those live on
# different drive letters, that throws (no such thing as a cross-drive
# relative path). Disabling incremental compilation avoids it entirely.
kotlin.incremental=false
